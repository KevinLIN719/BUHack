<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" fill="none">
  <title>縱向 A4 紙本保單</title>
  <desc>630 比 891 的縱向保單紙，正面呈現橙色 Policy Lens、閱讀摘要和投保前確認附件。</desc>
  <defs>
    <linearGradient id="paper" x1="45" y1="0" x2="630" y2="891" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset=".6" stop-color="#fffefa"/><stop offset="1" stop-color="#f6f4ef"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="891" gradientUnits="userSpaceOnUse"><stop stop-color="#ecebe7"/><stop offset="1" stop-color="#fdfdfb"/></linearGradient>
    <pattern id="ruling" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 0H24M0 0V24" stroke="#e8e1d9" stroke-width=".7"/></pattern>
    <clipPath id="clip"><rect width="630" height="891" rx="9"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#8a6f60" flood-opacity=".10"/></filter>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="1" dy="4" stdDeviation="3" flood-color="#8a6f60" flood-opacity=".10"/></filter>
  </defs>
  <!-- Upright A4 front sheet. The page owns the two horizontal trailing sheets. -->
  <g transform="translate(34 28)">
    <rect width="630" height="891" rx="9" fill="url(#paper)" stroke="#d6d2ca" stroke-width="1.2" filter="url(#shadow)"/>
    <g clip-path="url(#clip)">
      <rect width="630" height="891" fill="url(#ruling)" opacity=".48"/>
      <path d="M40 0V891" stroke="#e6d5c9" stroke-width=".8"/>
      <text x="432" y="52" fill="#a39a8c" font-family="Arial,Helvetica,PingFang TC,Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="9" letter-spacing="1.5">PL—001／共 06 頁</text>
      <text x="56" y="124" fill="#E85A3A" font-family="Arial,Helvetica,PingFang TC,Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="62" letter-spacing="-3">Policy Lens</text>
      <text x="60" y="160" fill="#958c80" font-family="Arial,Helvetica,PingFang TC,Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="11" letter-spacing="2.5">旅遊保險／示例條款</text>
      <path d="M60 190H570M60 208H570" stroke="#d8d0c4" opacity=".75"/>
      <text x="60" y="248" fill="#8c8174" font-family="Arial,Helvetica,PingFang TC,Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="13" letter-spacing="1.5">保單閱讀摘要</text>
      <g stroke="#ddd6ca" stroke-width="1"><path d="M60 272H570M60 294H544M60 316H570M60 338H466"/></g>
      <g transform="matrix(1.1 0 0 1.1 -424 101.8)" filter="url(#card-shadow)">
        <path d="M448 270h178l22 22v200H448Z" fill="#f4f1ea" stroke="#dcd5c9" stroke-width="1"/>
        <path d="M440 262h178l22 22v200H440Z" fill="#fffdf8" stroke="#cdc5b8" stroke-width="1.2"/>
        <path d="M618 262v22h22" fill="#efe9de" stroke="#cdc5b8" stroke-width="1.2"/>
        <text x="460" y="302" fill="#E85A3A" font-family="Arial,Helvetica,PingFang TC,Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">保單</text>
        <text x="460" y="320" fill="#8f877b" font-family="Arial,Helvetica,PingFang TC,Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="8.5" letter-spacing="1.6">旅遊／01</text>
        <path d="M460 334h160" stroke="#ddd5c9" stroke-width="1"/>
        <path d="M460 358h160" stroke="#d9d1c5" stroke-width="1"/><path d="M460 375h148" stroke="#d9d1c5" stroke-width="1"/><path d="M460 392h160" stroke="#d9d1c5" stroke-width="1"/><path d="M460 409h120" stroke="#d9d1c5" stroke-width="1"/><path d="M460 426h156" stroke="#d9d1c5" stroke-width="1"/><path d="M460 443h104" stroke="#d9d1c5" stroke-width="1"/>
        <text x="460" y="468" fill="#a39a8c" font-family="Arial,Helvetica,PingFang TC,Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="8" letter-spacing="1.5">虛構示例</text>
        <text x="606" y="468" fill="#a39a8c" font-family="Arial,Helvetica,PingFang TC,Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="8" letter-spacing="1.5">01</text>
      </g>
      <g transform="matrix(1.1 0 0 1.1 -402.6 101.8)" filter="url(#card-shadow)">
        <path d="M674 270h178l22 22v200H674Z" fill="#f4f1ea" stroke="#dcd5c9" stroke-width="1"/>
        <path d="M666 262h178l22 22v200H666Z" fill="#fffdf8" stroke="#cdc5b8" stroke-width="1.2"/>
        <path d="M844 262v22h22" fill="#efe9de" stroke="#cdc5b8" stroke-width="1.2"/>
        <text x="686" y="302" fill="#E85A3A" font-family="Arial,Helvetica,PingFang TC,Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">投保前確認</text>
        <text x="686" y="320" fill="#8f877b" font-family="Arial,Helvetica,PingFang TC,Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="8.5" letter-spacing="1.6">附件／清單</text>
        <path d="M686 334h160" stroke="#ddd5c9" stroke-width="1"/>
        <rect x="686" y="354" width="11" height="11" rx="2.5" fill="#E85A3A"/><path d="m688.5 359.8 2.3 2.3 4.4-4.6" stroke="#fff" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="706" y="363.5" fill="#6f665b" font-family="Arial,Helvetica,PingFang TC,Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="9.5" letter-spacing=".8">保障範圍與條件</text><path d="M706 374h118" stroke="#e1d9cd" stroke-width="1"/><rect x="686.5" y="390.5" width="10" height="10" rx="2.5" fill="#fff" stroke="#b8ad9c"/><text x="706" y="399.5" fill="#6f665b" font-family="Arial,Helvetica,PingFang TC,Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="9.5" letter-spacing=".8">申請所需文件</text><path d="M706 410h104" stroke="#e1d9cd" stroke-width="1"/><rect x="686.5" y="426.5" width="10" height="10" rx="2.5" fill="#fff" stroke="#b8ad9c"/><text x="706" y="435.5" fill="#6f665b" font-family="Arial,Helvetica,PingFang TC,Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="9.5" letter-spacing=".8">需要確認的問題</text><path d="M706 446h124" stroke="#e1d9cd" stroke-width="1"/>
        <text x="686" y="468" fill="#a39a8c" font-family="Arial,Helvetica,PingFang TC,Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="8" letter-spacing="1.5">虛構示例</text>
        <text x="832" y="468" fill="#a39a8c" font-family="Arial,Helvetica,PingFang TC,Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="8" letter-spacing="1.5">02</text>
      </g>
      <text x="60" y="706" fill="#E85A3A" font-family="Arial,Helvetica,PingFang TC,Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="15" font-weight="600" letter-spacing="1">投保前，逐項看清。</text>
      <g stroke="#ddd6ca" stroke-width="1"><path d="M60 734H570M60 758H540M60 782H570"/></g>
      <path d="M60 820H570" stroke="#d8d0c4"/>
      <text x="60" y="850" fill="#9a9184" font-family="Arial,Helvetica,PingFang TC,Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="9" letter-spacing="1.8">讀清條款，知道保障界線。</text>
      <text x="550" y="850" fill="#a39a8c" font-family="Arial,Helvetica,PingFang TC,Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="9">01</text>
    </g>
  </g>
</svg>
